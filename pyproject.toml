[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emporio-agent"
version = "0.1.0"
description = "Customer service agent for the fictional music store Empório da Música"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.50,<3",
    "python-dotenv>=1.0,<2",
    "pypdf>=5.0,<7",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9"]

[project.scripts]
emporio-agent = "emporio_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
# Tests that call the real provider spend free-tier quota, so they are opt-in: pytest -m live
addopts = "-m \"not live\""
markers = ["live: calls the real LLM provider (needs .env)"]
